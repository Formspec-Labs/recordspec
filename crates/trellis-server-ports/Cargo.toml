[package]
name = "trellis-server-ports"
version.workspace = true
edition.workspace = true
description = "Composition-root port contracts for the Trellis service boundary"
license.workspace = true

[dependencies]
async-trait = "0.1"
integrity-cbor = { path = "../../../integrity-stack/crates/integrity-cbor" }
stack-common-auth = { path = "../../../stack-common/crates/stack-common-auth" }
stack-common-error = { path = "../../../stack-common/crates/stack-common-error", default-features = false }
serde_json = "1"
stack-common-scope = { path = "../../../stack-common/crates/stack-common-scope" }
trellis-cddl = { path = "../trellis-cddl" }
trellis-core = { path = "../trellis-core" }
trellis-export-writer = { path = "../trellis-export-writer" }
trellis-service-client = { path = "../trellis-service-client" }
trellis-types = { path = "../trellis-types" }

[dev-dependencies]
stack-common-scope = { path = "../../../stack-common/crates/stack-common-scope", features = ["composition-root"] }
tokio = { version = "1", features = ["macros", "rt"] }
