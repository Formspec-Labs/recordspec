[package]
name = "trellis-admission-formspec"
version.workspace = true
edition.workspace = true
description = "Formspec-aware Trellis admission adapter"
license.workspace = true

[dependencies]
utoipa = "6"
async-trait = "0.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
integrity-cbor = { path = "../../../integrity-stack/crates/integrity-cbor" }
integrity-cose = { path = "../../../integrity-stack/crates/integrity-cose" }
integrity-canonical = { path = "../../../integrity-stack/crates/integrity-canonical" }
trellis-cddl = { path = "../trellis-cddl" }
stack-common-error = { path = "../../../stack-common/crates/stack-common-error" }
stack-common-hash = { path = "../../../stack-common/crates/stack-common-hash" }
trellis-server-ports = { path = "../trellis-server-ports" }
trellis-types = { path = "../trellis-types" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
