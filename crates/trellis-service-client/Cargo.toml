[package]
name = "trellis-service-client"
version.workspace = true
edition.workspace = true
description = "Shared Trellis service HTTP client and substrate contract"
license.workspace = true

[features]
default = []
# Fixed privacy-preserving Source append capture in explicitly selected test dependencies.
test-diagnostics = []

[dependencies]
integrity-cbor = { path = "../../../integrity-stack/crates/integrity-cbor", features = ["json"] }
base64 = "0.22"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stack-common-auth = { path = "../../../stack-common/crates/stack-common-auth" }
stack-common-error = { path = "../../../stack-common/crates/stack-common-error", default-features = false }
stack-common-http = { path = "../../../stack-common/crates/stack-common-http" }
trellis-types = { path = "../trellis-types" }
tokio = { version = "1", features = ["time"] }
utoipa = "5"
wos-events = { path = "../../../work-spec/crates/wos-events" }

[dev-dependencies]
stack-common-typeid = { path = "../../../stack-common/crates/stack-common-typeid", features = ["testing"] }
tokio = { version = "1", features = ["macros", "rt"] }
