structure_verified    = true
integrity_verified    = false
readability_verified  = true
first_failure_kind    = "attestation_insufficient"
failing_event_id      = "0ba4d2b7fa8571a2f955a10726cdb6dfebe8ad3e7781fdfde1a4ccc7ce36f6d2"
attestation_authority = "failed"

