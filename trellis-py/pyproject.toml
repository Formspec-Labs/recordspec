[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trellis-py"
version = "0.1.0"
description = "Independent Python Trellis Phase-1 implementation (append, verify, export) for G-5 vector conformance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cbor2>=5.6.0",
  "cryptography>=42.0.0",
  # Native provenance records are validated against the WOS-owned JSON Schema
  # (Draft 2020-12); `rfc3339-validator` makes the schema's `date-time` format enforced.
  "jsonschema>=4.21.0",
  "rfc3339-validator>=0.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
trellis-py-vectors = "trellis_py.conformance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trellis_py = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
